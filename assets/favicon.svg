<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- graduation cap favicon; 2-tone, uses site accent (#58a6ff) + warm tassel -->
  <!-- cap base (head band) -->
  <path d="M28 46 L72 46 L72 61 Q50 72 28 61 Z" fill="#1f6feb"/>
  <!-- mortarboard (diamond top plate) -->
  <path d="M50 22 L88 39 L50 56 L12 39 Z" fill="#58a6ff"/>
  <!-- button at center -->
  <circle cx="50" cy="39" r="3.6" fill="#0d1117"/>
  <!-- tassel: cord from center to right corner, then hanging down -->
  <path d="M50 39 L79 39 L79 64" fill="none" stroke="#e3b341" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tassel knob -->
  <circle cx="79" cy="68" r="5.2" fill="#e3b341"/>
</svg>
